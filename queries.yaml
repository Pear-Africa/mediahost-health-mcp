# Mediahost AI - Health Check Query Definitions
#
# Each check:
#   name:           unique identifier (no spaces)
#   description:    human-readable label shown in the report
#   query:          SQL returning a single scalar value
#   pass_condition: Numeric: eq:0  neq:0  gt:0  gte:1  lt:100  lte:99  between:1:10
#                  Time:    time_since:minutes:30  time_since:hours:1  time_since:days:7
#   fail_message:   shown when the check fails — use {value} for the result
#
# Time-based checks: Pass if the returned timestamp is WITHIN the threshold (recent enough).
#   - Query should return a datetime (ISO 8601 string, Unix timestamp, or native DateTime)
#   - time_since:unit:threshold where unit is: seconds, minutes, hours, or days
#   - Example: time_since:hours:1 passes if data is less than 1 hour old
#
# This file is hot-reloaded on every run. No restart needed when adding checks.

checks:

  # -------------------------------------------------------------------------
  # Kafka / Messaging
  # -------------------------------------------------------------------------

  - name: meltwater_kafka_online_delivery
    description: "Meltwater Online Kafka queue empty — all messages delivered"
    query: >
      Select count(*)
      FROM pearhpmszm_db4.allocation a
      JOIN `pearhpmszm_db4`.clip c ON c.id = a.idclip
      JOIN `pearhpmszm_db2`.search s ON s.id = a.IDSearch
      JOIN `pearhpmszm_db2`.set se ON se.id = s.idset AND (se.idclient = 66437 or se.id = 8733)
      LEFT JOIN pearhpmszm_db2.MeltwaterDeliveryReg_History h ON h.Online_lastAllocationID = a.id 
      WHERE (
          se.idatclient IS NOT NULL 
          AND se.idstatus = 1
          AND s.statusid = 1
          AND LENGTH(c.text) > 50
          AND   c.text  NOT LIKE '%This article is reserved%'  AND     c.text  NOT LIKE '%Teken IN op Netwerk24 en kry vandag%'    
          AND     c.text  NOT LIKE '%Support the Sunday Times BY buying a subscription%' 
          AND     c.text  NOT LIKE '%Get 14 days free to read all our investigative and in-depth journalism%'
          AND a.dt > ADDDATE(CURRENT_DATE,-30)
          AND h.id IS NULL
      )
    pass_condition: "eq:0"
    fail_message: "{value} messages still pending in Meltwater Online Kafka queue"

